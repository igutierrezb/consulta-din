<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Consulta DIN</title><link rel="stylesheet" href="din-2027.css"><script src="config.js"></script></head><body><main class="wrap"><section class="workspace" style="margin:50px auto;max-width:680px"><a href="./">← Consulta pública</a><h1>Administración DIN</h1><p>Prepara periodos, importa datos, gestiona aulas y genera paquetes de horarios sin modificar la consulta pública hasta que decidas publicar.</p><a id="enter" class="primary" hidden>Entrar a Administración ↗</a><p id="message" class="notice">Buscando la implementación administrativa configurada…</p></section></main><script>(function(){var u=window.DIN_CONFIG&&window.DIN_CONFIG.adminUrl;if(!u){document.getElementById('message').textContent='Falta adminUrl en config.js.';return;}try{var url=new URL(u);url.searchParams.set('action','admin');document.getElementById('enter').href=url.href;document.getElementById('enter').hidden=false;document.getElementById('message').textContent='Acceso protegido con tu cuenta administradora institucional.';}catch(e){document.getElementById('message').textContent='La URL administrativa configurada no es válida.';}})();</script></body></html>
